name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build:stable
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools
        run: |
          choco install -y nsis wixtoolset --no-progress
          if (-not (Test-Path "templates")) { mkdir "templates" }
          cp "node_modules/electrobun-builder-for-windows/templates/*" "templates/"
          
          # Targeted detection for NSIS
          $nsisPaths = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          foreach ($p in $nsisPaths) {
            if (Test-Path "$p\makensis.exe") {
              Add-Content $env:GITHUB_PATH $p
              Write-Host "Detected NSIS: $p"
              break
            }
          }

          # Targeted detection for WiX Toolset
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v3.10\bin"
          )
          foreach ($p in $wixPaths) {
            if (Test-Path "$p\candle.exe") {
              Add-Content $env:GITHUB_PATH $p
              Write-Host "Detected WiX: $p"
              $found = $true
              break
            }
          }
          
          if (-not $found) {
            Write-Host "Warning: candle.exe not found in standard paths. Attempting fallback search..."
            $wixBin = (Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*" -Filter "candle.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
            if ($wixBin) {
              Add-Content $env:GITHUB_PATH $wixBin
              Write-Host "Detected WiX (fallback): $wixBin"
            }
          }
        shell: pwsh

      - name: Build Windows Installer (NSIS)
        run: |
          # Map launcher.exe to Editary.exe for resource patching (icon etc)
          if (-not (Test-Path "build/stable-win-x64/Editary.exe")) {
             $srcExe = Get-ChildItem -Path "node_modules/electrobun/dist-win-x64" -Filter "launcher.exe" -Recurse | Select-Object -First 1
             if ($null -ne $srcExe) {
                Copy-Item $srcExe.FullName "build/stable-win-x64/Editary.exe"
                Write-Host "Mapped app binary: $($srcExe.FullName) -> build/stable-win-x64/Editary.exe"
             }
          }
          bun run builder -- build --target nsis
        shell: pwsh

      - name: Build Windows Installer (WiX/MSI)
        run: |
          bun run builder -- build --target wix
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
