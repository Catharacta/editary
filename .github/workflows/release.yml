name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64,macos-x64
          - os: windows-latest
            target: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Application
        run: bunx electrobun build --targets ${{ matrix.target }}
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y nsis wixtoolset --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $nsisPath) { echo "$nsisPath" >> $env:GITHUB_PATH }
          if (Test-Path $wixPath) { echo "$wixPath" >> $env:GITHUB_PATH }
        shell: pwsh

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          bunx electrobun-builder build --target nsis
          bunx electrobun-builder build --target wix

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/stable-*/**/*-Setup.exe
            build/stable-*/**/*-Setup.tar.zst
            build/stable-*/**/*.dmg
            build/stable-*/**/*.zip
            dist/*.exe
            dist/*.msi
