name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64,macos-x64
          - os: windows-latest
            target: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Application
        run: |
          bun run build:stable
          # Find where the exe is and print its full path
          Get-ChildItem -Path . -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "Found EXE: $($_.FullName)" }
        shell: pwsh
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y nsis wixtoolset --no-progress
          if (-not (Test-Path "templates")) { mkdir "templates" }
          cp "node_modules/electrobun-builder-for-windows/templates/*" "templates/"
          
          # Add tools to PATH
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) { 
            Add-Content $env:GITHUB_PATH "$nsisPath"
            Write-Host "Added NSIS to PATH: $nsisPath"
          }
          
          # Search for WiX
          $wixDir = Get-ChildItem -Path "C:\Program Files (x86)" -Filter "WiX Toolset*" | Select-Object -First 1
          if ($null -ne $wixDir) {
            $binPath = Join-Path $wixDir.FullName "bin"
            if (Test-Path $binPath) { 
              Add-Content $env:GITHUB_PATH "$binPath"
              Write-Host "Added WiX to PATH: $binPath"
            }
          }
        shell: pwsh

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          # Verify PATH
          Write-Host "Verifying commands in PATH:"
          where.exe makensis
          where.exe candle
          where.exe light
          # Copy binary to where builder expects it (if needed)
          # Based on electrobun-builder source, it expects it in build/stable-win-x64/Editary.exe
          # We saw that it might be in build/stable-win-x64/Editary/bin/launcher.exe
          if (-not (Test-Path "build/stable-win-x64/Editary.exe")) {
             $srcExe = Get-ChildItem -Path "build/stable-win-x64" -Recurse -Filter "*.exe" | Select-Object -First 1
             if ($null -ne $srcExe) {
                Write-Host "Copying $($srcExe.FullName) to build/stable-win-x64/Editary.exe"
                cp $srcExe.FullName "build/stable-win-x64/Editary.exe"
             }
          }
          bunx electrobun-builder build --target nsis
          bunx electrobun-builder build --target wix
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/stable-*/**/*-Setup.exe
            build/stable-*/**/*-Setup.tar.zst
            build/stable-*/**/*.dmg
            build/stable-*/**/*.zip
            dist/*.exe
            dist/*.msi
