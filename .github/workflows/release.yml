name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build:stable
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools
        run: |
          choco install nsis wixtoolset --yes
          # NSIS と WiX のパスを GITHUB_PATH に確実に書き込む
          $nsisPath = "C:\Program Files (x86)\NSIS"
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $nsisPath) { Add-Content -Path $env:GITHUB_PATH -Value $nsisPath }
          if (Test-Path $wixPath) { Add-Content -Path $env:GITHUB_PATH -Value $wixPath }
        shell: pwsh

      - name: Build Windows Installer (NSIS)
        run: |
          bun run builder -- build --target nsis
        shell: pwsh

      - name: Build Windows Installer (WiX/MSI)
        run: |
          bun run builder -- build --target wix
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
