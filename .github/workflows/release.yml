name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Application
        run: bun run build:stable
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools
        run: |
          choco install -y nsis wixtoolset --no-progress
          if (-not (Test-Path "templates")) { mkdir "templates" }
          cp "node_modules/electrobun-builder-for-windows/templates/*" "templates/"
          
          # Add tools to PATH
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.11\bin"
        shell: pwsh

      - name: Build Windows Installer (NSIS)
        run: |
          # Map launcher.exe to Editary.exe for resource patching (icon etc)
          if (-not (Test-Path "build/stable-win-x64/Editary.exe")) {
             $srcExe = Get-ChildItem -Path "node_modules/electrobun/dist-win-x64" -Filter "launcher.exe" -Recurse | Select-Object -First 1
             if ($null -ne $srcExe) {
                Copy-Item $srcExe.FullName "build/stable-win-x64/Editary.exe"
                Write-Host "Mapped app binary: $($srcExe.FullName) -> build/stable-win-x64/Editary.exe"
             }
          }
          bun run builder -- build --target nsis
        shell: pwsh

      - name: Build Windows Installer (WIX/MSI)
        run: |
          bun run builder -- build --target msi
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
