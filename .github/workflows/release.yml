name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64,macos-x64
          - os: windows-latest
            target: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Application
        run: bun run build:stable
        env:
          ELECTROBUN_BUILD_ENV: stable

      - name: Install Packaging Tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y nsis wixtoolset --no-progress
          if (-not (Test-Path "templates")) { mkdir "templates" }
          cp "node_modules/electrobun-builder-for-windows/templates/*" "templates/"
          
          # Add tools to PATH
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)" -Filter "WiX Toolset*" | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName "bin" }
          if ($null -ne $wixBin) {
            Add-Content $env:GITHUB_PATH "$wixBin"
            # Shim wix.exe to candle.exe to satisfy builder dependency check
            $candle = Join-Path $wixBin "candle.exe"
            $wixShim = Join-Path $wixBin "wix.exe"
            if (Test-Path $candle) { Copy-Item $candle $wixShim }
          }
        shell: pwsh

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          # Map launcher.exe to Editary.exe for resource patching (icon etc)
          if (-not (Test-Path "build/stable-win-x64/Editary.exe")) {
             $srcExe = Get-ChildItem -Path "node_modules/electrobun/dist-win-x64" -Filter "launcher.exe" -Recurse | Select-Object -First 1
             if ($null -ne $srcExe) {
                Copy-Item $srcExe.FullName "build/stable-win-x64/Editary.exe"
                Write-Host "Mapped app binary: $($srcExe.FullName) -> build/stable-win-x64/Editary.exe"
             }
          }
          bunx electrobun-builder build --target nsis
          bunx electrobun-builder build --target wix
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.app.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
