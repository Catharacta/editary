<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editary</title>
  <link rel="stylesheet" href="views://mainview/index.css" />
  <!-- KaTeX CSS for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
</head>

<body>
  <!-- Custom Titlebar (Draggable) -->
  <div id="titlebar" class="titlebar electrobun-webkit-app-region-drag">
    <div class="titlebar-left">
      <div class="titlebar-title">Editary</div>
      <div class="titlebar-menu electrobun-webkit-app-region-no-drag">
        <div class="dropdown">
          <button id="helpMenuBtn" class="titlebar-menu-btn" aria-haspopup="true" aria-expanded="false">ヘルプ</button>
          <div id="helpDropdown" class="dropdown-content hidden">
            <button id="showLicenseBtn" class="dropdown-item">ライセンス情報...</button>
          </div>
        </div>
      </div>
    </div>
    <div class="titlebar-controls electrobun-webkit-app-region-no-drag">
      <button id="minimizeBtn" class="titlebar-btn titlebar-btn--minimize" aria-label="最小化">
        <svg width="10" height="1" viewBox="0 0 10 1">
          <rect width="10" height="1" fill="currentColor" />
        </svg>
      </button>
      <button id="maximizeBtn" class="titlebar-btn titlebar-btn--maximize" aria-label="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" fill="none" stroke-width="1" />
        </svg>
      </button>
      <button id="closeBtn" class="titlebar-btn titlebar-btn--close" aria-label="閉じる">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5" />
          <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div id="app" class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">

      <!-- Section 1: Open Editors -->
      <div class="sidebar-section" id="openEditorsSection">
        <div class="section-header">
          <button class="section-toggle" id="openEditorsToggle" aria-label="セクション切り替え">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" class="chevron">
              <polygon points="2,0 8,5 2,10" />
            </svg>
          </button>
          <span class="section-title">エディタ</span>
          <div class="section-actions">
            <button class="section-action-btn" id="newFileFromEditorsBtn" title="新規ファイル">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
            <button class="section-action-btn" id="saveAllBtn" title="すべて保存">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <polyline points="17 21 17 13 7 13 7 21" />
                <polyline points="7 3 7 8 15 8" />
              </svg>
            </button>
            <button class="section-action-btn" id="closeAllBtn" title="すべて閉じる">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
        <div class="section-content" id="openEditorsList">
          <!-- Open Editor tabs rendered by JS -->
        </div>
      </div>

      <!-- Section 2: Workspace -->
      <div class="sidebar-section" id="workspaceSection">
        <div class="section-header">
          <button class="section-toggle" id="workspaceToggle" aria-label="セクション切り替え">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" class="chevron">
              <polygon points="2,0 8,5 2,10" />
            </svg>
          </button>
          <span class="section-title">ワークスペース</span>
          <div class="section-actions">
            <button class="section-action-btn" id="newFileBtn" title="新規ファイル">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
            <button class="section-action-btn" id="newFolderBtn" title="新規フォルダ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                <line x1="12" y1="11" x2="12" y2="17" />
                <line x1="9" y1="14" x2="15" y2="14" />
              </svg>
            </button>
            <button class="section-action-btn" id="refreshBtn" title="更新">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
            </button>
            <button class="section-action-btn" id="closeWorkspaceBtn" title="ワークスペースを閉じる">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="9" y1="12" x2="15" y2="18"></line>
                <line x1="15" y1="12" x2="9" y2="18"></line>
              </svg>
            </button>
            <button class="section-action-btn" id="collapseAllBtn" title="フォルダを折りたたむ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <polyline points="4 14 10 14 10 20" />
                <polyline points="20 10 14 10 14 4" />
                <line x1="14" y1="10" x2="21" y2="3" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            </button>
          </div>
        </div>
        <div class="section-content" id="fileTree">
          <div class="file-tree-empty">
            フォルダを開いてください
          </div>
        </div>
      </div>

      <!-- Open Folder Button (shown when no workspace) -->
      <div id="openFolderPrompt" class="open-folder-prompt">
        <button id="openFolderBtn" class="neo-btn neo-btn--full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="square" stroke-linejoin="miter">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          ワークスペースを開く
        </button>
      </div>

    </aside>

    <!-- Editor Area -->
    <main id="editorContainer" class="editor-container">
      <div id="editorToolbar" class="editor-toolbar hidden">
        <div class="toolbar-left" style="display: flex; gap: 8px;">
          <div class="toolbar-dropdown">
            <button id="tableInsertBtn" class="toolbar-btn" title="テーブルの挿入" aria-haspopup="true" aria-expanded="false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="3" y1="15" x2="21" y2="15"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
                <line x1="15" y1="3" x2="15" y2="21"/>
              </svg>
              <span>テーブル</span>
            </button>
            <div id="tableGridPicker" class="table-grid-picker hidden">
              <div class="table-grid-info" id="tableGridInfo">3 x 3</div>
              <div class="table-grid" id="tableGridContainer">
                <!-- Grids rendered by JS -->
              </div>
            </div>
          </div>
          <button id="updateContentBtn" class="toolbar-btn" title="内容をパースし直して更新します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            <span>更新 (Sync)</span>
          </button>
        </div>
        <div class="toolbar-right">
          <div id="syntaxStatus" class="syntax-status hidden">
            <div id="statusIconInfo" class="status-icon hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div id="statusIconWarning" class="status-icon hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <span id="syntaxStatusText"></span>
          </div>
        </div>
      </div>
      <div id="editor" class="editor">
        <!-- Tiptap editor will be mounted here -->
      </div>
      
      <!-- Search & Replace Panel -->
      <div id="searchPanel" class="search-panel hidden">
        <div class="search-panel-row">
          <input type="text" id="searchInput" class="search-input neo-input" placeholder="検索..." />
          <span id="searchResultCount" class="search-count">0/0</span>
          <button id="searchPrevBtn" class="search-btn" title="前へ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="18 15 12 9 6 15" /></svg>
          </button>
          <button id="searchNextBtn" class="search-btn" title="次へ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="6 9 12 15 18 9" /></svg>
          </button>
          <button id="searchCloseBtn" class="search-btn search-close" title="閉じる">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        
        <div class="search-panel-row search-replace-row" id="replaceRowContainer">
          <input type="text" id="replaceInput" class="search-input neo-input" placeholder="置換..." />
          <button id="replaceBtn" class="search-text-btn" title="置換">置換</button>
          <button id="replaceAllBtn" class="search-text-btn" title="すべて置換">すべて</button>
        </div>
        
        <button id="toggleReplaceBtn" class="toggle-replace-btn" title="置換を切り替え">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="6 9 12 15 18 9" /></svg>
          <span style="font-size: 10px; margin-left: 4px;">置換</span>
        </button>
      </div>
      
      <div id="tableBubbleMenu" class="bubble-menu">
        <button id="tb-addRowBefore" class="bubble-btn" title="上に行を追加">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/><line x1="5" y1="5" x2="19" y2="5"/></svg>
        </button>
        <button id="tb-addRowAfter" class="bubble-btn" title="下に行を追加">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/><line x1="5" y1="19" x2="19" y2="19"/></svg>
        </button>
        <button id="tb-deleteRow" class="bubble-btn" title="行を削除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><line x1="5" y1="5" x2="19" y2="5"/><line x1="5" y1="19" x2="19" y2="19"/></svg>
        </button>
        <span class="bubble-divider"></span>
        <button id="tb-addColumnBefore" class="bubble-btn" title="左に列を追加">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14M12 5v14"/><line x1="5" y1="5" x2="5" y2="19"/></svg>
        </button>
        <button id="tb-addColumnAfter" class="bubble-btn" title="右に列を追加">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14M12 5v14"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button id="tb-deleteColumn" class="bubble-btn" title="列を削除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14"/><line x1="5" y1="5" x2="5" y2="19"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <span class="bubble-divider"></span>
        <button id="tb-mergeCells" class="bubble-btn" title="セルの結合/解除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 4h16v16H4V4z"/><path d="M4 12h16"/><path d="M12 4v16"/></svg>
        </button>
        <span class="bubble-divider"></span>
        <button id="tb-deleteTable" class="bubble-btn bubble-btn--danger" title="テーブルを削除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>

    </main>
  </div>

  <!-- Status Bar -->
  <footer id="statusBar" class="status-bar hidden">
    <div class="status-item" id="statusLines">行: 0</div>
    <div class="status-item" id="statusWords">単語数: 0</div>
    <div class="status-item" id="statusChars">文字数: 0</div>
    <div class="status-spacer"></div>
    <div class="status-item" id="statusEncoding">UTF-8</div>
  </footer>

  <!-- License Modal -->
  <div id="licenseModal" class="modal-overlay hidden">
    <div class="license-modal neo-modal">
      <div class="modal-header">
        <h2>オープンソースライセンス</h2>
        <button id="closeLicenseModalBtn" class="modal-close-btn" aria-label="閉じる">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-content">
        <p class="license-intro">Editary は以下の素晴らしいオープンソースソフトウェアを利用して構築されています。</p>
        <div id="licenseList" class="license-list">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="views://mainview/index.js"></script>
</body>

</html>
