<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editary</title>
  <link rel="stylesheet" href="views://mainview/index.css" />
  <!-- KaTeX CSS for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
</head>

<body>
  <!-- Custom Titlebar (Draggable) -->
  <div id="titlebar" class="titlebar electrobun-webkit-app-region-drag">
    <div class="titlebar-title">Editary</div>
    <div class="titlebar-controls electrobun-webkit-app-region-no-drag">
      <button id="minimizeBtn" class="titlebar-btn titlebar-btn--minimize" aria-label="最小化">
        <svg width="10" height="1" viewBox="0 0 10 1">
          <rect width="10" height="1" fill="currentColor" />
        </svg>
      </button>
      <button id="maximizeBtn" class="titlebar-btn titlebar-btn--maximize" aria-label="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" fill="none" stroke-width="1" />
        </svg>
      </button>
      <button id="closeBtn" class="titlebar-btn titlebar-btn--close" aria-label="閉じる">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.5" />
          <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div id="app" class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">

      <!-- Section 1: Open Editors -->
      <div class="sidebar-section" id="openEditorsSection">
        <div class="section-header">
          <button class="section-toggle" id="openEditorsToggle" aria-label="セクション切り替え">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" class="chevron">
              <polygon points="2,0 8,5 2,10" />
            </svg>
          </button>
          <span class="section-title">エディタ</span>
          <div class="section-actions">
            <button class="section-action-btn" id="newFileFromEditorsBtn" title="新規ファイル">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
            <button class="section-action-btn" id="saveAllBtn" title="すべて保存">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <polyline points="17 21 17 13 7 13 7 21" />
                <polyline points="7 3 7 8 15 8" />
              </svg>
            </button>
            <button class="section-action-btn" id="closeAllBtn" title="すべて閉じる">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
        <div class="section-content" id="openEditorsList">
          <!-- Open Editor tabs rendered by JS -->
        </div>
      </div>

      <!-- Section 2: Workspace -->
      <div class="sidebar-section" id="workspaceSection">
        <div class="section-header">
          <button class="section-toggle" id="workspaceToggle" aria-label="セクション切り替え">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" class="chevron">
              <polygon points="2,0 8,5 2,10" />
            </svg>
          </button>
          <span class="section-title">ワークスペース</span>
          <div class="section-actions">
            <button class="section-action-btn" id="newFileBtn" title="新規ファイル">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
            <button class="section-action-btn" id="newFolderBtn" title="新規フォルダ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                <line x1="12" y1="11" x2="12" y2="17" />
                <line x1="9" y1="14" x2="15" y2="14" />
              </svg>
            </button>
            <button class="section-action-btn" id="refreshBtn" title="更新">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
            </button>
            <button class="section-action-btn" id="closeWorkspaceBtn" title="ワークスペースを閉じる">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="9" y1="12" x2="15" y2="18"></line>
                <line x1="15" y1="12" x2="9" y2="18"></line>
              </svg>
            </button>
            <button class="section-action-btn" id="collapseAllBtn" title="フォルダを折りたたむ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="square">
                <polyline points="4 14 10 14 10 20" />
                <polyline points="20 10 14 10 14 4" />
                <line x1="14" y1="10" x2="21" y2="3" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            </button>
          </div>
        </div>
        <div class="section-content" id="fileTree">
          <div class="file-tree-empty">
            フォルダを開いてください
          </div>
        </div>
      </div>

      <!-- Open Folder Button (shown when no workspace) -->
      <div id="openFolderPrompt" class="open-folder-prompt">
        <button id="openFolderBtn" class="neo-btn neo-btn--full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="square" stroke-linejoin="miter">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          ワークスペースを開く
        </button>
      </div>

    </aside>

    <!-- Editor Area -->
    <main id="editorContainer" class="editor-container">
      <div id="editor" class="editor">
        <!-- Tiptap editor will be mounted here -->
      </div>
      
      <!-- Search & Replace Panel -->
      <div id="searchPanel" class="search-panel hidden">
        <div class="search-panel-row">
          <input type="text" id="searchInput" class="search-input neo-input" placeholder="検索..." />
          <span id="searchResultCount" class="search-count">0/0</span>
          <button id="searchPrevBtn" class="search-btn" title="前へ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="18 15 12 9 6 15" /></svg>
          </button>
          <button id="searchNextBtn" class="search-btn" title="次へ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="6 9 12 15 18 9" /></svg>
          </button>
          <button id="searchCloseBtn" class="search-btn search-close" title="閉じる">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        
        <div class="search-panel-row search-replace-row" id="replaceRowContainer">
          <input type="text" id="replaceInput" class="search-input neo-input" placeholder="置換..." />
          <button id="replaceBtn" class="search-text-btn" title="置換">置換</button>
          <button id="replaceAllBtn" class="search-text-btn" title="すべて置換">すべて</button>
        </div>
        
        <button id="toggleReplaceBtn" class="toggle-replace-btn" title="置換を切り替え">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><polyline points="6 9 12 15 18 9" /></svg>
          <span style="font-size: 10px; margin-left: 4px;">置換</span>
        </button>
      </div>
      
      <!-- Status Bar -->
      <footer id="statusBar" class="status-bar hidden">
        <div class="status-item" id="statusLines">行: 0</div>
        <div class="status-item" id="statusWords">単語数: 0</div>
        <div class="status-item" id="statusChars">文字数: 0</div>
        <div class="status-spacer"></div>
        <div class="status-item" id="statusEncoding">UTF-8</div>
      </footer>
    </main>
  </div>

  <script src="views://mainview/index.js"></script>
</body>

</html>
